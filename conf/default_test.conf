server {
	listen 8080;			# sets address &| port for IP
	server_name localhost;	# sets the name of a virtual server (can have multiple)
	error_page 404 /Error404.html;# define the URI shown for specified error(s)
	client_max_body_size 1000000;	# sets the max size of a client request body. If too large, 413 (Request Entity Too Large) error returned to client. 0 disable the check
	root ./www/html;					# sets the root Directory for requests
	index index.html;		# defines file(s) that will be used as index

#location par defaut
	location / {		
		autoindex off;			# on/off directory listing
		allow_methods GET POST;
		index index.html;
	}

#upload de fichier
	location /upload {		
		autoindex off;			# on/off directory listing
		allow_methods GET DELETE;
		index index.html;
		client_max_body_size 5000000;
	}

#Scripts CGI PHP
	location /cgi-bin {
		allow_methods GET POST;
		cgi_path /usr/bin/php;
		cgi_ext .php;
	}
}

server {
	listen 8081;
	server_name localhost2;
	client_max_body_size 1000000;

	location / {
		root ./www2;
		index index.html;
		allow_methods GET;
	}
}

