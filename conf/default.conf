server {
	listen 80;				# sets address &| port for IP
	host					# ?
	server_name				# sets the name of a virtual server (can have multiple)
	error_page				# define the URI shown for specified error(s)
	client_max_body_size	# sets the max size of a client request body. If too large, 413 (Request Entity Too Large) error returned to client. 0 disable the check
	root					# sets the root Directory for requests
	index					# defines file(s) that will be used as index

	location /tours {
		root
		autoindex			# on/off directory listing
		allow_methods
		index
		return
		alias				# defines a replacement for specified location
	}

	location cgi-bin {
		root
		cgi_path
		cgi_ext
	}
}
