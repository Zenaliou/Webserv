<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calculatrice</title>
<style>
    table {
        border-collapse: collapse;
        margin: 50px auto;
    }
    td, th {
        border: 1px solid #333;
        width: 60px;
        height: 60px;
        text-align: center;
        font-size: 20px;
        cursor: pointer;
    }
    td:hover {
        background: #ddd;
    }
    #result {
        width: 100%;
        height: 60px;
        font-size: 24px;
        text-align: right;
        padding: 10px;
        background: #eee;
        box-sizing: border-box;
    }
</style>
</head>
<body>

<table>
    <tr>
        <th colspan="4">
            <div id="result">0</div>
        </th>
    </tr>
    <tr>
        <td onclick="action(this)">7</td>
        <td onclick="action(this)">8</td>
        <td onclick="action(this)">9</td>
        <td onclick="action(this)">/</td>
    </tr>
    <tr>
        <td onclick="action(this)">4</td>
        <td onclick="action(this)">5</td>
        <td onclick="action(this)">6</td>
        <td onclick="action(this)">*</td>
    </tr>
    <tr>
        <td onclick="action(this)">1</td>
        <td onclick="action(this)">2</td>
        <td onclick="action(this)">3</td>
        <td onclick="action(this)">-</td>
    </tr>
    <tr>
        <td onclick="action(this)">0</td>
        <td onclick="action(this)">.</td>
        <td onclick="action(this)">=</td>
        <td onclick="action(this)">+</td>
    </tr>
    <tr>
        <td colspan="4" onclick="action(this)">C</td>
    </tr>
</table>

<script>
let result = document.getElementById("result");

function action(element) {
    let value = element.innerText;

    if (value !== "=" && value !== "C") {
        if (result.innerText === "0" || result.innerText === "erreur") {
            result.innerText = value;
        } else {
            result.innerText += value;
        }
    } 
    else if (value === "C") {
        result.innerText = "0";
    } 
    else if (value === "=") {
        try {
            result.innerText = eval(result.innerText);
        } catch {
            result.innerText = "erreur";
        }
    }
} // ← c’est ici qu’on ferme correctement la fonction
</script>

</body>
</html>
