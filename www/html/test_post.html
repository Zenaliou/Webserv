<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test POST</title>
</head>
<body>

<h2>Test Requête POST</h2>

<input type="text" id="endpoint" placeholder="/api/users"><br><br>

<textarea id="body" rows="10" cols="50" placeholder='{"name":"Jean"}'></textarea><br><br>

<button onclick="sendPost()">Envoyer POST</button>

<pre id="result"></pre>

<script>
function sendPost() {

    const endpoint = document.getElementById("endpoint").value;
    const body = document.getElementById("body").value;

    fetch("http://localhost:8080" + endpoint, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: body
    })
    .then(response => response.text())
    .then(data => {
        document.getElementById("result").textContent = data;
    })
    .catch(err => {
        document.getElementById("result").textContent = err;
    });

}
</script>

</body>
</html>
